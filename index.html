<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f7fb" />
  <meta name="description" content="企业数据中心交互原型，覆盖厂商接入、字段治理、更新任务与企业数据服务。" />
  <title>企业数据中心 · 公开演示版</title>
  <link rel="stylesheet" href="./styles.css" />
<style>.public-demo-notice{display:flex;flex-direction:column;gap:6px;margin-bottom:20px;padding:14px 18px;border:1px solid #f0c36c;border-radius:10px;background:#fff8e7;color:#684612;font-size:13px;line-height:1.7}.public-demo-notice strong{font-size:14px}.public-demo-notice span{display:block}</style></head>
<body>
  <div id="app" class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="主导航">
      <a class="brand" href="#overview" aria-label="DataHub 企业数据中心首页">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none"><path d="M4 8 14 3l10 5-10 5L4 8Z" fill="currentColor"/><path d="m4 14 10 5 10-5M4 20l10 5 10-5" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg></span>
        <span class="brand-copy"><strong>DataHub<span class="brand-dot">.</span></strong><small>企业数据中心</small></span>
      </a>
      <div class="workspace-switch"><span class="workspace-icon">企</span><div><strong>企业数据工作空间</strong><span>管理控制台</span></div><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 8 4 4 4-4"/></svg></div>
      <nav class="nav-menu">
        <p class="nav-section-label">工作台</p>
        <button class="nav-item active" data-nav="overview" title="数据总览"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>数据总览</span></button>
        <p class="nav-section-label">数据管理</p>
        <button class="nav-item" data-nav="sources" title="数据接入"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3M16 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M7 12h10m-4-4 4 4-4 4"/></svg><span>数据接入</span></button>
        <button class="nav-item" data-nav="scripts" title="脚本管理"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 7-5 5 5 5m8-10 5 5-5 5M14 4l-4 16"/></svg><span>脚本管理</span></button>
        <button class="nav-item" data-nav="priorities" title="字段取值优先级"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h12M9 12h9M9 18h6M3 4v4m-1-3 1-1 1 1M2 12h2l-2 3h2M2 18h2l-1 1 1 1H2"/></svg><span>字段取值优先级</span></button>
        <button class="nav-item" data-nav="updates" title="更新任务"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10a8 8 0 0 0-14-5L3 8m0-5v5h5m-4 6a8 8 0 0 0 14 5l3-3m0 5v-5h-5"/></svg><span>更新任务</span></button>
        <button class="nav-item" data-nav="enterprises" title="企业数据"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v16M17 10h2a2 2 0 0 1 2 2v9M2 21h20M8 7h5M8 11h5M8 15h5M9 21v-3h3v3"/></svg><span>企业数据</span></button>
        <p class="nav-section-label">数据服务</p>
        <button class="nav-item" data-nav="services" title="API 服务"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 9-3 3 3 3m8-6 3 3-3 3M13 8l-2 8"/></svg><span>API 服务</span><span class="nav-service-dot"></span></button>
      </nav>
      <div class="sidebar-bottom"><div class="sidebar-help"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v16H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm9 0h7a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-7V4Z"/></svg><span>从数据接入到服务交付</span></div><span class="prototype-label">PRODUCT PROTOTYPE · V1.0</span></div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><div class="breadcrumb"><span>管理控制台</span><span class="breadcrumb-divider">/</span><strong>企业数据中心</strong></div><div class="topbar-right"><span class="environment-badge"><i></i>交互演示</span><span class="topbar-divider"></span><span class="avatar" aria-hidden="true">管</span><span class="user-label">数据管理员</span></div></header>
      <main class="main-content"><div class="public-demo-notice" role="note"><strong>公开演示版 · 数据仅保存在当前浏览器</strong><span>真实厂商 API 需服务端部署；配置、企业、脚本及任务使用本机 IndexedDB 保存，不同浏览器之间不共享。请仅导入演示数据。清理站点数据会删除本机工作空间。</span></div>
        <section id="page-header" class="page-header"><div id="page-heading"><span class="eyebrow">DATA WORKSPACE</span><h1>数据总览</h1><p class="subtle">连接企业数据，让每一次查询都有据可循。</p></div><div id="header-actions" class="header-actions"></div></section>
        <div id="page-content"><div class="loading-shell" role="status" aria-label="正在加载数据中心"><div class="stats-grid"><div class="skeleton skeleton-stat"></div><div class="skeleton skeleton-stat"></div><div class="skeleton skeleton-stat"></div><div class="skeleton skeleton-stat"></div></div><div class="skeleton skeleton-panel"></div><span class="loading-caption">正在加载工作空间…</span></div></div>
        <footer class="main-footer"><span>DataHub 企业数据中心</span><span>接入 · 治理 · 更新 · 服务</span></footer>
      </main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" role="status" aria-live="polite"></div>
  <script type="module" src="./pages-bootstrap.mjs"></script>
</body>
</html>
